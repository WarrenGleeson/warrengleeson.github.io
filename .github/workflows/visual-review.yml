name: Visual review screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-review
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Start local site server
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/visual-review-server.log 2>&1 &
          echo $! > /tmp/visual-review-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/visual-review-server.log
          exit 1

      - name: Capture visual review screenshots
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p visual-review/latest/homepage visual-review/latest/eirepolitic
          cat > capture-visual-review.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const base = 'http://127.0.0.1:4173';
          const viewports = [
            { name: 'desktop-1440', width: 1440, height: 1000 },
            { name: 'compact-1024', width: 1024, height: 900 },
            { name: 'mobile-390', width: 390, height: 844 },
          ];

          const targets = [
            {
              name: 'homepage',
              path: '/',
              output: 'visual-review/latest/homepage',
              sections: [
                ['hero', '.home-hero'],
                ['featured-project', '.home-featured-project'],
                ['work-on', '.home-work-grid'],
                ['selected-work', '.home-selected-work'],
                ['contact', '.home-contact'],
              ],
            },
            {
              name: 'eirepolitic',
              path: '/portfolio/eirepolitic/',
              output: 'visual-review/latest/eirepolitic',
              sections: [
                ['opening', '.ep-opening'],
                ['outcome', '.ep-outcome-strip'],
                ['why-built', '.ep-story-intro'],
                ['sources-ingestion', '.ep-stage-sources'],
                ['canonical-model', '.ep-stage-model'],
                ['classification', '.ep-stage-classifier'],
                ['political-metrics', '.ep-stage-metrics'],
                ['content-factory', '.ep-stage-factory'],
                ['publishing', '.ep-stage-publishing'],
                ['capability-summary', '.ep-summary'],
                ['continue-exploring', '.ep-next-steps'],
              ],
            },
          ];

          const browser = await chromium.launch({ headless: true });
          try {
            for (const target of targets) {
              for (const viewport of viewports) {
                const context = await browser.newContext({
                  viewport: { width: viewport.width, height: viewport.height },
                  deviceScaleFactor: 1,
                });
                const page = await context.newPage();
                await page.goto(base + target.path, { waitUntil: 'networkidle' });
                await page.screenshot({
                  path: `${target.output}/${viewport.name}-full.png`,
                  fullPage: true,
                });

                if (viewport.name === 'desktop-1440') {
                  for (const [name, selector] of target.sections) {
                    const locator = page.locator(selector).first();
                    if (await locator.count()) {
                      await locator.screenshot({ path: `${target.output}/section-${name}.png` });
                    }
                  }
                }
                await context.close();
              }
            }
          } finally {
            await browser.close();
          }

          fs.writeFileSync(
            'visual-review/latest/README.md',
            `# Visual review output\n\nSource ref: \`${process.env.SOURCE_REF}\`\n\nSource commit: \`${process.env.SOURCE_SHA}\`\n\nGenerated screenshots are under \`visual-review/latest/homepage/\` and \`visual-review/latest/eirepolitic/\`.\n`
          );
          EOF
          node capture-visual-review.mjs
          rm capture-visual-review.mjs

      - name: Publish screenshots to visual-review branch
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          cp -R visual-review /tmp/visual-review-output
          git fetch origin visual-review
          git switch --force-create visual-review origin/visual-review
          rm -rf visual-review/latest
          mkdir -p visual-review
          cp -R /tmp/visual-review-output/latest ./visual-review/latest
          git add visual-review/latest
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update visual review screenshots for ${SOURCE_REF}"
          git push origin HEAD:visual-review
