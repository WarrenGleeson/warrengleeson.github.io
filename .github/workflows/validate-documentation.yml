name: Validate documentation

on:
  pull_request:
    paths:
      - "_docs/**"
      - "docs/**"
      - "assets/**"
      - "_layouts/**"
      - "_includes/**"
      - "_data/**"
      - "_templates/**"
      - "scripts/validate_docs.py"
      - "scripts/test_sly_lambda_lifecycle.py"
      - ".github/workflows/validate-documentation.yml"
      - "DOCUMENTATION_STANDARD.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate documentation and capture diagnostic
        id: docs
        shell: bash
        run: |
          set +e
          python scripts/validate_docs.py > /tmp/docs-validation.log 2>&1
          code=$?
          cat /tmp/docs-validation.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist temporary diagnostic on PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cp /tmp/docs-validation.log diagnostics/docs-validation.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/docs-validation.log
          if ! git diff --cached --quiet; then
            git commit -m 'chore: capture documentation validation diagnostics'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Fail if documentation invalid
        if: steps.docs.outputs.code != '0'
        run: exit 1

      - name: Install Sly Director GitHub MCP dependencies
        run: python -m pip install --disable-pip-version-check -r assets/sly-director/github-mcp-source/requirements.txt

      - name: Import-check Sly Director GitHub MCP dependencies
        run: python -c "import mcp, mangum, httpx, jwt, nacl, pydantic"

      - name: Import-check Sly Director GitHub MCP application
        env:
          GITHUB_OWNER: example-owner
          GITHUB_TOKEN: github_pat_example
          PUBLIC_MCP_URL: https://example.lambda-url.us-east-2.on.aws/mcp
          AUTHKIT_ISSUER: https://example.authkit.app
          DEFAULT_BASE_BRANCH: main
          BRANCH_PREFIX: sly/
        run: PYTHONPATH=assets/sly-director/github-mcp-source python -c "from src import app; from src import lambda_entry"

      - name: Test Sly Director Lambda MCP lifecycle
        env:
          GITHUB_OWNER: example-owner
          GITHUB_TOKEN: github_pat_example
          PUBLIC_MCP_URL: https://example.lambda-url.us-east-2.on.aws/mcp
          AUTHKIT_ISSUER: https://example.authkit.app
          DEFAULT_BASE_BRANCH: main
          BRANCH_PREFIX: sly/
        run: PYTHONPATH=assets/sly-director/github-mcp-source python scripts/test_sly_lambda_lifecycle.py

      - name: Syntax-check Sly Director GitHub MCP source
        run: python -m compileall -q assets/sly-director/github-mcp-source/src
