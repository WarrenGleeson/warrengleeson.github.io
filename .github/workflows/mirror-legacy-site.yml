name: Mirror legacy documentation site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new documentation repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone legacy public documentation repository
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/eirepolitic/eirepolitic.github.io.git /tmp/legacy-site

      - name: Create mirror branch and replace site source
        run: |
          set -euo pipefail
          git checkout -B migration/legacy-site-mirror

          # Remove current working-tree content, preserving only Git metadata.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Mirror the legacy site source. Do not activate its old Actions workflows.
          rsync -a --exclude='.git/' --exclude='.github/workflows/' /tmp/legacy-site/ ./

          # Preserve the old workflows as inert reference material.
          if [ -d /tmp/legacy-site/.github/workflows ]; then
            mkdir -p legacy-workflows
            cp -R /tmp/legacy-site/.github/workflows/. legacy-workflows/
          fi

      - name: Commit mirrored site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: mirror legacy Eirepolitic documentation site"
          git push --force-with-lease origin migration/legacy-site-mirror
